name: Build etaHEN-L92

on:
  workflow_dispatch:
  push:
    branches: [l92]
    paths-ignore:
      - "**.md"
      - "README*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build xz-utils cmake

      - name: Install PS5 payload SDK (pacbrew)
        run: |
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          tar xf ps5-payload-dev.tar.gz -C /tmp
          sudo mv /tmp/opt/ps5-payload-sdk /opt/ps5-payload-sdk

      - name: Build
        shell: bash
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          PS5SDK: /opt/ps5-payload-sdk
        run: |
          set -x
          cd "Source Code"
          cmake --preset nix-base
          cmake --build --preset default-build-nix

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp "Source Code/bin/unpacker.elf" out/etaHEN-L92.bin || true
          cp "Source Code/bin/"*.elf out/ || true
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etaHEN-L92
          path: out/
          if-no-files-found: error
