name: Build etaHEN-L92

on:
  workflow_dispatch:
    inputs:
      fw_version:
        description: "Firmware cible (V_FW, ex: 0x960)"
        required: false
        default: "0x960"
  push:
    branches: [l92]
    paths-ignore:
      - "**.md"
      - "README*"

env:
  V_FW: ${{ github.event.inputs.fw_version || '0x960' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xz-utils cmake wget

      - name: Install pacbrew PS5 SDK (v0.30.2, époque etaHEN 2.5B)
        run: |
          set -x
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.30.2/ps5-payload-dev.tar.gz
          tar xf ps5-payload-dev.tar.gz -C /tmp
          mv /tmp/opt/ps5-payload-sdk /opt/ps5-payload-sdk
          ls /opt/ps5-payload-sdk
          test -f /opt/ps5-payload-sdk/toolchain/prospero.cmake
          test -f /opt/ps5-payload-sdk/target/include/ps5/payload.h
          test -f /opt/ps5-payload-sdk/target/include/c++/v1/cstdint

      - name: Build Byepervisor hen.bin
        run: |
          set -x
          cd "SourceCode/bootstrapper/Byepervisor/hen"
          export CXX=/opt/ps5-payload-sdk/bin/prospero-clang++
          export CC=/opt/ps5-payload-sdk/bin/prospero-clang
          export AS=/opt/ps5-payload-sdk/bin/prospero-clang
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          # CFLAGS du Makefile : ajouter les includes du SDK cible
          make CXX="$CXX" AS="$AS" \
            CFLAGS="-std=c++20 -Wall -D_KERNEL -I./include -I/opt/ps5-payload-sdk/target/include -O2 -fno-builtin -nostartfiles -nostdlib -fno-stack-protector -fno-plt -fPIC -Wno-error=frame-address -Wno-unused-command-line-argument -target x86_64-sie-ps5 -g3" \
            SFLAGS="-target x86_64-sie-ps5" \
            LFLAGS="-target x86_64-sie-ps5 -Xlinker -T ./link.x -Wl,--build-id=none -nostdlib"
          ls -la hen.bin

      - name: Build
        shell: bash
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          set -x
          cmake -G Ninja -S SourceCode -B SourceCode/build \
            -DCMAKE_TOOLCHAIN_FILE=/opt/ps5-payload-sdk/toolchain/prospero.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS5_PAYLOAD_SDK=/opt/ps5-payload-sdk \
            -DV_FW="$V_FW"
          cmake --build SourceCode/build --parallel

      - name: Collect artifacts
        run: |
          mkdir -p out
          find SourceCode/build -name "*.elf" -exec ls -la {} \;
          cp SourceCode/bin/etaHEN.elf out/etaHEN-L92.bin 2>/dev/null || true
          find SourceCode/build -name "*.elf" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etaHEN-L92
          path: out/
          if-no-files-found: error
