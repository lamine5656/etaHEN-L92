name: Build etaHEN-L92

on:
  workflow_dispatch:
    inputs:
      fw_version:
        description: "Firmware cible (V_FW, ex: 0x960)"
        required: false
        default: "0x960"
  push:
    branches: [l92]
    paths-ignore:
      - "**.md"
      - "README*"

env:
  V_FW: ${{ github.event.inputs.fw_version || '0x960' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xz-utils cmake wget

      - name: Install pacbrew PS5 SDK (v0.30.2, époque etaHEN 2.5B)
        run: |
          set -x
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.30.2/ps5-payload-dev.tar.gz
          tar xf ps5-payload-dev.tar.gz -C /tmp
          mv /tmp/opt/ps5-payload-sdk /opt/ps5-payload-sdk
          ls /opt/ps5-payload-sdk
          test -f /opt/ps5-payload-sdk/toolchain/prospero.cmake
          test -f /opt/ps5-payload-sdk/target/include/ps5/payload.h
          test -f /opt/ps5-payload-sdk/target/include/c++/v1/cstdint

      - name: Build
        shell: bash
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          set -x
          cmake -G Ninja -S SourceCode -B SourceCode/build \
            -DCMAKE_TOOLCHAIN_FILE=/opt/ps5-payload-sdk/toolchain/prospero.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS5_PAYLOAD_SDK=/opt/ps5-payload-sdk \
            -DV_FW="$V_FW"
          cmake --build SourceCode/build --parallel

      - name: Collect artifacts
        run: |
          mkdir -p out
          find SourceCode/build -name "*.elf" -exec ls -la {} \;
          cp SourceCode/bin/etaHEN.elf out/etaHEN-L92.bin 2>/dev/null || true
          find SourceCode/build -name "*.elf" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etaHEN-L92
          path: out/
          if-no-files-found: error
