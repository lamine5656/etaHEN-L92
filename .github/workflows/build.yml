name: Build etaHEN-L92

on:
  workflow_dispatch:
  push:
    branches: [l92]
    paths-ignore:
      - "**.md"
      - "README*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build xz-utils cmake

      - name: Install PS5SDK (PS5Dev)
        run: |
          git clone --depth 1 https://github.com/PS5Dev/PS5SDK.git /opt/PS5SDK
          ls /opt/PS5SDK
          ls /opt/PS5SDK/cmake

      - name: Build
        shell: bash
        env:
          PS5SDK: /opt/PS5SDK
          PS5_PAYLOAD_SDK: /opt/PS5SDK
        run: |
          set -x
          cmake -G Ninja -S SourceCode -B build \
            -DCMAKE_TOOLCHAIN_FILE=/opt/PS5SDK/cmake/toolchain-ps5.cmake \
            -DPS5_PAYLOAD_SDK=/opt/PS5SDK \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Collect artifacts
        run: |
          mkdir -p out
          find build -name "*.elf" -exec ls -la {} \;
          cp build/bin/etaHEN.elf out/etaHEN-L92.bin 2>/dev/null || true
          find build -name "*.elf" -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etaHEN-L92
          path: out/
          if-no-files-found: error
